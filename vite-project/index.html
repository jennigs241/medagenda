<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedAgenda — Gestion des rendez-vous</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>🩺 MedAgenda</h1>
      <p class="subtitle">Gestion centralisée des rendez-vous médicaux</p>
    </div>
  </header>

  <main class="container">
    <!-- Section Statistiques (Tableau de bord) -->
    <section class="dashboard">
      <div class="stat-card">
        <h3>Total RDV</h3>
        <span id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <h3>Patients</h3>
        <span id="stat-patients">0</span>
      </div>
      <div class="stat-card stat-pending">
        <h3>En attente</h3>
        <span id="stat-pending">0</span>
      </div>
      <div class="stat-card stat-completed">
        <h3>Terminés</h3>
        <span id="stat-completed">0</span>
      </div>
      <div class="stat-card stat-cancelled">
        <h3>Annulés</h3>
        <span id="stat-cancelled">0</span>
      </div>
    </section>

    <!-- Contrôles : Action rapide & Barre de recherche / filtres -->
    <section class="controls">
      <button id="btn-open-modal" class="btn btn-primary">+ Nouveau rendez-vous</button>
      <button id="btn-filter-today" class="btn btn-secondary">📅 RDV du jour</button>

      <div class="filters">
        <input type="text" id="search-input" placeholder="Rechercher patient, tel, médecin, motif...">
        
        <select id="status-filter">
          <option value="ALL">Tous les statuts</option>
          <option value="PENDING">En attente</option>
          <option value="CONFIRMED">Confirmé</option>
          <option value="COMPLETED">Terminé</option>
          <option value="CANCELLED">Annulé</option>
        </select>

        <input type="date" id="date-filter">
        <button id="btn-reset-filters" class="btn btn-small">Réinitialiser</button>
      </div>
    </section>

    <!-- Liste des rendez-vous -->
    <section class="appointments-section">
      <h2>Liste des rendez-vous</h2>
      <div id="appointments-list" class="appointments-grid">
        <!-- Généré dynamiquement en JS -->
      </div>
    </section>
  </main>

  <!-- Modal Formulaire (Création / Modification) -->
  <div id="appointment-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modal-title">Nouveau rendez-vous</h2>
      
      <div id="form-error" class="alert alert-danger hidden"></div>

      <form id="appointment-form" novalidate>
        <input type="hidden" id="appointment-id">

        <div class="form-group">
          <label for="patient">Nom du patient *</label>
          <input type="text" id="patient" required>
        </div>

        <div class="form-group">
          <label for="phone">Téléphone *</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="doctor">Médecin *</label>
          <select id="doctor" required>
            <option value="">-- Sélectionner un médecin --</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Heure *</label>
            <input type="time" id="time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reason">Motif de consultation *</label>
          <textarea id="reason" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="status">Statut *</label>
          <select id="status" required>
            <option value="PENDING">En attente</option>
            <option value="CONFIRMED">Confirmé</option>
            <option value="COMPLETED">Terminé</option>
            <option value="CANCELLED">Annulé</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel-form" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Entrée JS unique configurée en ES Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>

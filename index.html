!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedAgenda - Gestion des rendez-vous</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Chargement garanti dans le bon ordre grâce à defer -->
  <script src="js/storage.js" defer></script>
  <script src="js/appointments.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- En-tête -->
  <header class="main-header">
    <div class="header-content">
      <h1>🩺 MedAgenda</h1>
      <p>Gestion centralisée des rendez-vous médicaux</p>
    </div>
  </header>

  <main class="container">
    <!-- Statistiques -->
    <section class="stats-grid">
      <div class="stat-card blue">
        <span class="stat-label">TOTAL RDV</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card dark-blue">
        <span class="stat-label">PATIENTS</span>
        <span class="stat-value" id="stat-patients">0</span>
      </div>
      <div class="stat-card yellow">
        <span class="stat-label">EN ATTENTE</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
      <div class="stat-card green">
        <span class="stat-label">TERMINÉS</span>
        <span class="stat-value" id="stat-completed">0</span>
      </div>
      <div class="stat-card red">
        <span class="stat-label">ANNULÉS</span>
        <span class="stat-value" id="stat-cancelled">0</span>
      </div>
    </section>

    <!-- Barre d'outils et de filtres -->
    <section class="toolbar">
      <div class="toolbar-left">
        <button id="btn-open-modal" class="btn btn-primary">+ Nouveau rendez-vous</button>
        <button id="btn-today" class="btn btn-secondary">📆 RDV du jour</button>
        <button id="btn-export-csv" class="btn btn-outline" title="Exporter en CSV">📥 Exporter CSV</button>
      </div>

      <div class="toolbar-right">
        <input type="text" id="search-input" placeholder="Rechercher patient, tel, médecin..." class="form-control">
        
        <select id="filter-status" class="form-control">
          <option value="ALL">Tous les statuts</option>
          <option value="PENDING">En attente</option>
          <option value="CONFIRMED">Confirmé</option>
          <option value="COMPLETED">Terminé</option>
          <option value="CANCELLED">Annulé</option>
        </select>

        <input type="date" id="filter-date" class="form-control">

        <button id="btn-reset-filters" class="btn btn-light">Réinitialiser</button>
      </div>
    </section>

    <!-- Liste des rendez-vous -->
    <section class="appointments-section">
      <h2>Liste des rendez-vous</h2>
      <div id="appointments-container" class="appointments-grid">
        <!-- Les cartes de RDV seront injectées dynamiquement ici -->
      </div>
    </section>
  </main>

  <!-- Modal Formulaire (Création / Modification) -->
  <div id="modal-form" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="btn-close-modal">&times;</span>
      <h3 id="modal-title">Nouveau rendez-vous</h3>
      <form id="appointment-form">
        <input type="hidden" id="appointment-id">

        <div class="form-group">
          <label for="patient">Nom du patient *</label>
          <input type="text" id="patient" required>
        </div>

        <div class="form-group">
          <label for="phone">Téléphone *</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="doctor">Médecin *</label>
          <select id="doctor" required>
            <option value="">Chargement des médecins...</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Heure *</label>
            <input type="time" id="time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reason">Motif *</label>
          <input type="text" id="reason" required>
        </div>

        <div class="form-group">
          <label for="status">Statut *</label>
          <select id="status" required>
            <option value="PENDING">En attente</option>
            <option value="CONFIRMED">Confirmé</option>
            <option value="COMPLETED">Terminé</option>
            <option value="CANCELLED">Annulé</option>
          </select>
        </div>

        <div id="form-error" class="error-message hidden"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-light" id="btn-cancel-form">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

 
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedAgenda - Gestion de Rendez-vous</title>

  <!-- Liaison du fichier CSS principal (remplacez le nom du fichier si votre CSS s'appelle style.css) -->
  <link rel="stylesheet" href="./css/main.css">
  <script type="module" crossorigin src="/medagenda/assets/index-B5Qt9EMX.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>MedAgenda</h1>
    <button id="btn-open-modal" class="btn btn-primary">+ Nouveau Rendez-vous</button>
  </header>

  <main class="app-container">
    <!-- Section Tableau de Bord / Statistiques -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total RDV</span>
        <span id="stat-total" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Patients</span>
        <span id="stat-patients" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">En attente</span>
        <span id="stat-pending" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Terminés</span>
        <span id="stat-completed" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Annulés</span>
        <span id="stat-cancelled" class="stat-value">0</span>
      </div>
    </section>

    <!-- Section Filtres et Recherche -->
    <section class="filters-bar">
      <input type="text" id="search-input" placeholder="Rechercher un patient, téléphone, motif...">
      
      <select id="status-filter">
        <option value="ALL">Tous les statuts</option>
        <option value="PENDING">En attente</option>
        <option value="COMPLETED">Terminé</option>
        <option value="CANCELLED">Annulé</option>
      </select>

      <input type="date" id="date-filter">
      <button id="btn-reset-filters" class="btn btn-secondary">Réinitialiser</button>
    </section>

    <!-- Liste des rendez-vous -->
    <section id="appointments-list" class="appointments-grid">
      <!-- Les cartes seront injectées dynamiquement en JS -->
    </section>
  </main>

  <!-- Modal Formulaire -->
  <div id="appointment-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Rendez-vous</h2>
      <form id="appointment-form">
        <input type="hidden" id="appointment-id">
        
        <div class="form-group">
          <label for="patient">Nom du Patient</label>
          <input type="text" id="patient" required>
        </div>

        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="doctor">Médecin</label>
          <select id="doctor" required>
            <option value="Dr. Mbadinga">Dr. Mbadinga</option>
            <option value="Dr. Ondo">Dr. Ondo</option>
            <option value="Dr. Koumba">Dr. Koumba</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="time">Heure</label>
          <input type="time" id="time" required>
        </div>

        <div class="form-group">
          <label for="reason">Motif</label>
          <textarea id="reason" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="status">Statut</label>
          <select id="status">
            <option value="PENDING">En attente</option>
            <option value="COMPLETED">Terminé</option>
            <option value="CANCELLED">Annulé</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel-form" class="btn btn-secondary">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LIAISON OBLIGATOIRE DU SCRIPT JAVASCRIPT PRINCIPAL POUR VITE -->
</body>
</html>
